name: Verify and package
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned resource compiler
        shell: pwsh
        run: |
          $url = 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest $url -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd') { throw 'Toolchain hash mismatch' }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'llvm')
          (Join-Path $env:RUNNER_TEMP 'llvm/llvm-mingw-20261020-ucrt-x86_64/bin') | Out-File $env:GITHUB_PATH -Append
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          rustup default 1.99.1
          rustup target add ${{ matrix.target }}
      - name: Format and unit tests
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and package
        env:
          OMNIVIEW_BUILD_COMMIT: ${{ github.sha }}
        run: ./scripts/package.ps1 -Architecture ${{ matrix.arch }} -RustTarget ${{ matrix.target }}
      - name: Verify hashes and metadata
        run: ./scripts/verify-release.ps1 -Directory $(if ('${{ matrix.arch }}' -eq 'x86') {'dist/win32'} else {'dist'})
      - name: Attest release archive
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/**/OmniView*.exe
            dist/**/WebView2Loader.dll
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OmniView-${{ matrix.arch }}
          path: dist/OmniView-*-win*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: update-${{ matrix.arch }}
          path: |
            ${{ matrix.arch == 'x86' && 'dist/win32' || 'dist' }}/OmniView.exe
            ${{ matrix.arch == 'x86' && 'dist/win32' || 'dist' }}/OmniView-Student.exe
            ${{ matrix.arch == 'x86' && 'dist/win32' || 'dist' }}/WebView2Loader.dll
          if-no-files-found: error
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: node scripts/check-ui.cjs
      - run: node scripts/check-site.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OmniView-site
          path: site/.vitepress/dist
  release:
    needs: [windows, site]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    concurrency:
      group: publish-application
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: update-*
          path: publish
      - name: Publish application files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'preview' }}
        run: python scripts/publish-build.py
