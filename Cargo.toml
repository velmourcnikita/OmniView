[package]
name = "omniview"
version = "0.5.1"
edition = "2021"
description = "OmniView classroom console with a local WebView2 interface"
license = "MIT"

[dependencies]
wry = { version = "0.57.1", default-features = false, features = ["os-webview"] }
tao = "0.37.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
getrandom = "0.3"
ring = "0.17"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse"
] }

[[bin]]
name = "omniview"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
rpath = false
debug = false
